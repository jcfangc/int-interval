[workspace]
members = [".", "xtask/codegen"]

[package]
name = "int-interval"
version = "0.9.0"
edition = "2024"
description = "A small, no_std half-open interval algebra library for primitive integer types."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jcfangc/int-interval"
readme = "README.md"
keywords = ["interval", "range", "no_std", "integer", "algebra"]
categories = ["data-structures", "no-std"]


[dev-dependencies]
divan = "0.1.21"
proptest = "1.10.0"
rust_intervals = "1.0.0"


[lib]
doctest = false

[[bench]]
name = "construct"
harness = false

[[bench]]
name = "contains"
harness = false

[[bench]]
name = "contains_interval"
harness = false

[[bench]]
name = "iter"
harness = false

[[bench]]
name = "intersects"
harness = false

[[bench]]
name = "intersection"
harness = false

[[bench]]
name = "convex_hull"
harness = false

[[bench]]
name = "between"
harness = false

[[bench]]
name = "union"
harness = false

[[bench]]
name = "difference"
harness = false

[[bench]]
name = "symmetric_difference"
harness = false

[[bench]]
name = "contiguous"
harness = false
