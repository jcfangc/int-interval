repos:
  - repo: local
    hooks:
      - id: cargo-test
        name: cargo test
        entry: bash -lc 'cargo test'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: int-interval-codegen-check
        name: int-interval codegen check
        entry: cargo run -p codegen -- check
        language: system
        pass_filenames: false
